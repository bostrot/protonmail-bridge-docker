name: pack from deb

on:
  push:
    paths:
      - .github/workflows/deb.yaml
      - deb/*
      - VERSION
  pull_request:
    paths:
      - .github/workflows/deb.yaml
      - deb/*
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/protonmail-bridge
  GHCR_REPO_DEV: ghcr.io/${{ github.repository_owner }}/protonmail-bridge-dev
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'bostrot/protonmail-bridge' }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "version=`cat VERSION`" >> $GITHUB_ENV

      - name: Determine target registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          # Development builds stay on GHCR; only master publishes release tags.
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            echo "repo=${GHCR_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${GHCR_REPO_DEV}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_PASSWORD}" ] \
             && [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials not configured, publishing to GHCR only."
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.repo }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without push
        uses: docker/build-push-action@v6
        with:
          context: ./deb
          file: ./deb/Dockerfile
          load: true
          tags: protonmail-bridge:latest

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: protonmail-bridge:latest
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && steps.registries.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: ./deb
          file: ./deb/Dockerfile
          tags: |
            ${{ steps.registries.outputs.repo }}:latest
            ${{ steps.registries.outputs.repo }}:${{ env.version }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: true

      - name: Push image to Docker Hub
        if: ${{ github.event_name != 'pull_request' && steps.registries.outputs.dockerhub == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./deb
          file: ./deb/Dockerfile
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ env.version }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: true
